<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Secure checkout</title>
<!--
  Self-healing pay link. The team shares /pay/?t=<token> (WhatsApp, email). This page POSTs the token to the woo-order
  function, which re-reads the live Creative Beverages order and returns a checkout URL that WORKS RIGHT NOW (rebuilding a
  dead CB order if the old one aged out), then we redirect to it. Doing the CB work from JS here, not from the link's bare
  GET, means a link-preview bot that fetches the URL without running JS never creates or rebuilds a CB order.
-->
<style>
  html,body{margin:0;height:100%}
  body{background:#120d08;color:#e9e0cf;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;line-height:1.55}
  .card{max-width:420px}
  .spin{width:34px;height:34px;margin:0 auto 18px;border:3px solid rgba(216,180,94,.25);border-top-color:#d8b45e;
    border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  p{margin:0 0 10px}.small{font-size:14px;opacity:.82}
  a{color:#d8b45e;font-weight:700}
  b{color:#d8b45e}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="spin" id="spin"></div>
  <p id="msg">Opening your secure Creative Beverages checkout&#8230;</p>
  <p class="small" id="hint">On the next screen, pay by <b>card</b>, or choose <b>Zapper</b> and scan the QR. On a phone, card is easiest.</p>
</div>
<script>
(function(){
  var SUPABASE_URL = "https://yfopoeuncfpfizghqczr.supabase.co";
  var SUPABASE_KEY = "sb_publishable_aCL5Ko6acTk_pBSJ-zXvzA_UNSAyOcl";
  var WA_NUMBER = "27798207121";   // Edrich
  var t = new URLSearchParams(location.search).get('t') || '';
  var card = document.getElementById('card'), msg = document.getElementById('msg'),
      spin = document.getElementById('spin'), hint = document.getElementById('hint');
  function stop(){ if(spin){ spin.style.display = 'none'; } if(hint){ hint.style.display = 'none'; } }
  function fallback(text){
    stop();
    msg.textContent = text || "We couldn't open your checkout just now.";
    var p = document.createElement('p'); p.className = 'small';
    p.innerHTML = 'Message us and we\'ll send you a fresh pay link: <a href="https://wa.me/' + WA_NUMBER + '">Chat on WhatsApp</a>.';
    card.appendChild(p);
  }
  if(!t){ fallback('This payment link is not valid. '); return; }
  fetch(SUPABASE_URL + '/functions/v1/woo-order', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', apikey:SUPABASE_KEY, Authorization:'Bearer ' + SUPABASE_KEY },
    body: JSON.stringify({ token:t })
  }).then(function(r){ return r.json(); }).then(function(d){
    if(d && d.ok && d.pay_url){ location.replace(d.pay_url); return; }
    if(d && d.ok && d.paid){ stop(); msg.textContent = 'Good news: this order is already paid. Thank you!'; return; }
    fallback();
  }).catch(function(){ fallback(); });
})();
</script>
</body>
</html>
